version: '3.9'

services:
  db:
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: neo-machine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abr00mashaghi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: django-docker
    restart: always
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_NAME: neo_machine
      DB_USER: postgres
      DB_PASSWORD: abr00mashaghi
      DB_HOST: db
      DB_PORT: 5432

volumes:
  postgres_data: